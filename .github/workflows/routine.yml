name: Refresh Live MCQ routine
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1,13 * * *'
permissions:
  contents: write
concurrency:
  group: routine-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.13.4
      - run: python scripts/update_routine.py
      - name: Commit changed public schedule
        run: |
          git add routine-feed.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "project2029-routine[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh public exam schedule"
          git pull --rebase
          git push
